services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: origin_trace
      POSTGRES_PASSWORD: origin_trace_dev
      POSTGRES_DB: origin_trace
    ports:
      - "5433:5432"   # host 5433 -- avoids clashing with a native Postgres already on 5432
    volumes:
      - origin_trace_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://origin_trace:origin_trace_dev@postgres:5432/origin_trace
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  origin_trace_pgdata:
