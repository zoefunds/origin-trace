# ORIGIN TRACE backend — always-on indexer/API.
# Deploy with: fly launch --copy-config --name origin-trace-backend (first time)
#          or: fly deploy (subsequent updates)
app = "origin-trace-backend"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  POLL_INTERVAL_MS = "300000"   # 5 min -- see poller.ts for the change-detection that keeps this cheap

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # "must never die" -- do not let Fly scale this to zero
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
