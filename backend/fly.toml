# fly.toml app configuration file generated for origin-trace-backend-starlit-sound-5755 on 2026-09-28T19:18:21+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'origin-trace-backend-starlit-sound-5755'
primary_region = 'iad'

[build]
[env]
  POLL_INTERVAL_MS = '300000'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
